                - build time
                - etl timestamp

    relationships:
      - name: customer_suppression_to_customer
        from: customer_suppression
        to: customer
        from_columns: [customer_id]
        to_columns: [customer_id]

      - name: customer_suppression_to_dim_customer_vw
        from: customer_suppression
        to: dim_customer_vw
        from_columns: [shopper_id]
        to_columns: [shopper_id]

