                - GoDaddy employee
                - internal account

          - name: temporary_shopper_flag
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: temporary_shopper_flag
            description: "TRUE if the customer is a temporary or guest shopper."
            ai_context:
              synonyms:
                - guest shopper
                - temp shopper

          - name: closed_shopper_flag
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: closed_shopper_flag
            description: "TRUE if the shopper account is closed."
            ai_context:
              synonyms:
                - closed account
                - deactivated shopper

          - name: city_name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: city_name
            description: "Customer city name."

          - name: state_code
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: state_code
            description: "Customer state code."

          - name: zip_code
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: zip_code
            description: "Customer postal code."

          - name: country_code
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: country_code
            description: "Customer country code."

          - name: email_domain_name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: email_domain_name
            description: "Email domain name of the customer."
            ai_context:
              synonyms:
                - email domain
                - customer email domain

          - name: email_hash
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: email_hash
            description: "Hashed email address for PII-safe email matching."
            ai_context:
              synonyms:
                - hashed email
                - email hash

          - name: primary_phone_flag
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: primary_phone_flag
            description: "TRUE if a primary phone number is on file for this customer."

          - name: mobile_phone_flag
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: mobile_phone_flag
            description: "TRUE if a mobile phone number is on file for this customer."

          - name: secondary_phone_flag
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: secondary_phone_flag
            description: "TRUE if a secondary phone number is on file for this customer."

          - name: default_currency_code
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: default_currency_code
            description: "Default currency code for the customer's account."
            ai_context:
              synonyms:
                - currency
                - default currency

          - name: market_code
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: market_code
            description: "Market code for the customer."
            ai_context:
              synonyms:
                - market
                - customer market

          - name: created_mst_ts
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: created_mst_ts
            dimension:
              is_time: true
            description: "Account creation timestamp in Mountain Standard Time."
            ai_context:
              synonyms:
                - account created
                - customer since

          - name: updated_mst_ts
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: updated_mst_ts
            dimension:
              is_time: true
            description: "Last updated timestamp in Mountain Standard Time."
            ai_context:
              synonyms:
                - last updated
                - profile updated

          - name: closed_mst_ts
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: closed_mst_ts
            dimension:
              is_time: true
            description: "Account closure timestamp in Mountain Standard Time."
            ai_context:
              synonyms:
                - account closed
                - closed date

          - name: deleted_mst_ts
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: deleted_mst_ts
            dimension:
              is_time: true
            description: "Account deletion timestamp in Mountain Standard Time."
            ai_context:
              synonyms:
                - account deleted
                - deleted date

          - name: current_record_flag
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: current_record_flag
            description: >
              TRUE if this is the most recent record for the shopper. Always filter on
              current_record_flag = TRUE when joining to this dataset to avoid fan-out.
              This is a required filter condition in the ETL join that derives
              internal_account_flag on customer_suppression.
            ai_context:
              synonyms:
                - current record
                - latest record
                - is current

          - name: etl_build_mst_ts
            expression:
              dialects:
